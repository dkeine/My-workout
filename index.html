<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="description" content="Iron Log — the gym-floor logbook. Opens instantly, works offline, remembers what you lifted last time." />
  <title>Iron Log</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Iron Log" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <div id="view"></div>
    <nav>
      <div class="nav-grid" id="nav"></div>
    </nav>
  </div>

  <div id="toast">
    <span id="toast-icon"></span>
    <div>
      <div class="tt" id="toast-title"></div>
      <div class="ts" id="toast-sub"></div>
    </div>
  </div>

  <!-- Scripts loaded sequentially in dependency order -->
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/share.js"></script>
  <script src="js/importers.js"></script>
  <script src="js/card.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
